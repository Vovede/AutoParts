
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Подробная информация об автозапчасти в магазине AutoParts.">
    <title>Товар | AutoParts</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
    <link rel="stylesheet" href="css/responsive.css">

    <script src="js/products.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/product.js" defer></script>
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                AUTO<span>PARTS</span>
            </a>

            <nav class="navigation" id="navigation">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="about.html">О магазине</a>
            </nav>

            <div class="header-actions">
                <button class="theme-toggle" id="theme-toggle"
                        aria-label="Переключить тему">☀</button>

                <a href="cart.html" class="cart-link">
                    Корзина
                    <span class="cart-count" id="cart-count">0</span>
                </a>

                <button class="menu-toggle" id="menu-toggle"
                        aria-label="Открыть меню">☰</button>
            </div>
        </div>
    </header>

    <main>
        <section class="product-page">
            <div class="container">

                <div class="product-breadcrumbs">
                    <a href="index.html">Главная</a>
                    <span>/</span>
                    <a href="catalog.html">Каталог</a>
                    <span>/</span>
                    <span id="breadcrumb-name">Товар</span>
                </div>

                <div id="product-details">
                    <p class="product-loading">Загрузка товара...</p>
                </div>

                <div id="product-not-found" hidden>
                    <h1>Товар не найден</h1>
                    <p>Возможно, товар был удалён или ссылка указана неверно.</p>
                    <a href="catalog.html" class="button">
                        Вернуться в каталог
                    </a>
                </div>

            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-logo">
                AUTO<span>PARTS</span>
                <p>Автозапчасти для вашего автомобиля</p>
            </div>

            <div class="footer-links">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="about.html">О магазине</a>
            </div>

            <p class="footer-copy">
                © 2026 AutoParts. Все права защищены.
            </p>
        </div>
    </footer>

</body>
</html>
